name: Build OnePlus 6T Kernel with KSU-Next and SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git libssl-dev lzop patch python3 zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      - name: Download Prebuilt AOSP Clang
        run: |
          mkdir -p toolchain/clang
          # Fetch official prebuilt Google Android Clang 10 (r383902b) archive
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r48/clang-r383902b.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain/clang
          rm -f clang.tar.gz

      - name: Clone Sources
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_oneplus_sdm845 -b lineage-20 kernel
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

      - name: Integrate KernelSU-Next & SUSFS
        run: |
          cd kernel

          # Clone KernelSU-Next
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next.git drivers/kernelsu

          # Wire KSU into drivers
          if ! grep -q "CONFIG_KSU" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q "CONFIG_KSU" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          # Patch KernelSU-Next for SUSFS
          cd drivers/kernelsu
          patch -p1 --forward < ../../../susfs4ksu/KernelSU/10_enable_susfs_for_ksu.patch || true
          cd ../..

          # Copy core SUSFS files and apply 4.9 patch
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          patch -p1 --forward < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch || true

          # Append KSU and SUSFS configuration
          echo "CONFIG_KSU=y" >> arch/arm64/configs/fajita_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/fajita_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/fajita_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/fajita_defconfig

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out fajita_defconfig
          make -j$(nproc) O=out KCFLAGS="-Wno-error" KCPPFLAGS="-Wno-error"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cd anykernel
          zip -r9 ../OnePlus6T-KSU-Next-SUSFS.zip * -x .git README.md

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus6T-KSU-Next-SUSFS-Kernel
          path: OnePlus6T-KSU-Next-SUSFS.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: build-${{ github.run_number }}
          name: OnePlus 6T KernelSU-Next + SUSFS (Run #${{ github.run_number }})
          files: OnePlus6T-KSU-Next-SUSFS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
