name: Build OnePlus 6T Kernel with KSU-Next and SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Install Base Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git libssl-dev lzop patch python3 zip

      - name: Clone Proton Clang
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang toolchain/clang

      - name: Clone Sources
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_kernel_oneplus_sdm845 -b lineage-20 kernel
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

      - name: Integrate KernelSU-Next
        working-directory: kernel
        run: |
          # Clone KernelSU-Next
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next.git drivers/kernelsu

          # Create symlinks for Kconfig and Makefile
          ln -sf kernel/Kconfig drivers/kernelsu/Kconfig
          ln -sf kernel/Makefile drivers/kernelsu/Makefile

          # Connect KSU to drivers
          if ! grep -q "CONFIG_KSU" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          if ! grep -q "CONFIG_KSU" drivers/Makefile; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi

          # Patch KernelSU-Next for SUSFS
          cd drivers/kernelsu
          patch -p1 --forward < ../../../susfs4ksu/KernelSU/10_enable_susfs_for_ksu.patch || true

      - name: Patch Kernel for SUSFS
        working-directory: kernel
        run: |
          # Copy SUSFS core kernel files
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/

          # Apply SUSFS 4.9 patch
          patch -p1 --forward < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch || true

          # Set required defconfig options (including NR_CPUS fix)
          echo "CONFIG_NR_CPUS=8" >> arch/arm64/configs/fajita_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/fajita_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/fajita_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> arch/arm64/configs/fajita_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/fajita_defconfig

      - name: Compile Kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"

          # Configure defconfig
          make O=out ARCH=arm64 SUBARCH=arm64 fajita_defconfig

          # Ensure CONFIG_NR_CPUS is 8 in the generated config
          sed -i 's/CONFIG_NR_CPUS=.*/CONFIG_NR_CPUS=8/' out/.config

          # Compile kernel
          make -j$(nproc) O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" \
            KCPPFLAGS="-w"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cd anykernel
          zip -r9 ../OnePlus6T-KSU-Next-SUSFS.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnePlus6T-KSU-Next-SUSFS-Kernel
          path: OnePlus6T-KSU-Next-SUSFS.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: build-${{ github.run_number }}
          name: OnePlus 6T KernelSU-Next + SUSFS (#${{ github.run_number }})
          files: OnePlus6T-KSU-Next-SUSFS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
